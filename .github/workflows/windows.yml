name: Build MusicStudy Windows

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar e gerar instaladores
        shell: bash
        run: |
          gradle packageExe packageMsi

      - name: Publicar instaladores
        uses: actions/upload-artifact@v4
        with:
          name: MusicStudy-Windows
          path: |
            build/compose/binaries/main/exe/*.exe
            build/compose/binaries/main/msi/*.msi
